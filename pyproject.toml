[project]
name = "shinrai"
version = "0.1.0"
description = "Is this eval gain real? Paired significance tests for before/after model evals."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nancy Singh"}]

[project.scripts]
shinrai = "shinrai.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shinrai"]
